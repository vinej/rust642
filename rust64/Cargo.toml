[package]
name = "rust64"
version = "0.6.1"
authors = [ "Krzysztof Kondrak <krzysztof.kondrak@gmail.com>" ]
# Opt into Cargo's feature resolver v2 so [build-dependencies] features (like
# sdl3 -> sdl3-sys with "only-metadata", which enables no-link) don't bleed
# into the normal-dependency feature set and prevent SDL3.lib from being linked.
resolver = "2"

[dependencies]
minifb = "0.20"
rand = "0.3.14"
time = "0.1.34"
byteorder = "1.2.2"
enum_primitive = "0.1"
num = "0.1"
# 6502 core for the 1541 drive emulation. Decimal mode is rarely used by the
# 1541 DOS but cheap to leave on; "illegal_opcodes" is left off for now since
# the 1541 ROM doesn't use them.
emulator_6502 = { version = "1.1", features = ["binary_coded_decimal", "implementation_transparency"] }


[target.'cfg(not(target_os = "redox"))'.dependencies]
sdl3 = "0.18"
